spring.application.name=conservation-service
server.port=${CONSERVATION_SERVICE_PORT:8084}

# Optional local .env file (never committed). Works from the module folder (STS) or the repo root.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- One PostgreSQL database, one schema per service ---
# Defaults match docker-compose.yml (local development only). For Neon, set the three variables in .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wildguard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wildguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wildguard}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=conservation

# Flyway owns the schema: V1 creates the tables, V2 loads the demo data.
spring.flyway.schemas=conservation
spring.flyway.default-schema=conservation
spring.flyway.create-schemas=true

# --- Service-to-service REST ---
wildguard.internal-api-key=${WILDGUARD_INTERNAL_API_KEY:dev-internal-key-change-me}
wildguard.services.platform-url=${PLATFORM_SERVICE_URL:http://localhost:8081}
wildguard.services.wildlife-url=${WILDLIFE_SERVICE_URL:http://localhost:8082}
wildguard.services.operations-url=${OPERATIONS_SERVICE_URL:http://localhost:8083}
wildguard.services.conservation-url=${CONSERVATION_SERVICE_URL:http://localhost:8084}
wildguard.portal-base-url=${PORTAL_BASE_URL:http://localhost:8080}

server.error.include-message=always
logging.level.org.springframework.security=WARN
