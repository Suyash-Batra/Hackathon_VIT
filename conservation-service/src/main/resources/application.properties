spring.application.name=conservation-service
server.port=8084

# ---- Database ----
# Use the SAME PostgreSQL database as the platform app. My tables go into their own schema
# called "conservation", so they never mix with the tables of the other services.
# Put the real values in environment variables (or in your IDE run configuration):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# The defaults below are only for a local PostgreSQL. Never write a real password in this file.
spring.datasource.url=jdbc:postgresql://ep-dawn-hill-b3esygp4-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_csEm71YxrNgH

spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=conservation
spring.datasource.hikari.maximum-pool-size=4

# schema.sql creates the schema and tables when the service starts (only if they are missing).
# Hibernate does not create or change tables.



# true = put the demo rescue cases, resources and programmes in when the tables are empty
wildguard.load-demo-data=true

# ---- Login ----
# Must be the same secret as JwtService in the platform app, otherwise the token is refused.
wildguard.jwt-secret=${WILDGUARD_JWT_SECRET:WildGuardDevSecretKey2026WildGuardDevSecretKey}
# The address of the platform app. Its pages are allowed to call this service (CORS).
wildguard.allowed-origins=${WILDGUARD_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}

# ---- Other services ----
wildguard.services.wildlife-url=${WILDLIFE_SERVICE_URL:http://localhost:8082}
wildguard.services.operations-url=${OPERATIONS_SERVICE_URL:http://localhost:8083}
# false = an incident / animal / patrol id is accepted even if the other service does not know it yet.
# Set to true when wildlife-service and operations-service are finished.
wildguard.strict-links=false

logging.level.org.springframework.security=WARN
